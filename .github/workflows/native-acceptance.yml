name: Native disposable comet acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
          - runner: macos-15-intel
            platform: darwin/amd64
          - runner: macos-15
            platform: darwin/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: HARBOR_GO=go scripts/build.sh
      - name: Fresh comet, authenticated login, restart, maintenance and export/restore/replay
        env:
          ACCEPTANCE_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/native-acceptance.py --binary dist/harbor --output "$RUNNER_TEMP/harbor-trial" --disposable --require-platform "$ACCEPTANCE_PLATFORM" --lifecycle
      # Never upload piers, boot keys, access codes, cookies or raw Vere logs.
      - name: Keep credential-free result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-${{ matrix.runner }}
          path: ${{ runner.temp }}/harbor-trial/status.json
          if-no-files-found: ignore
          retention-days: 7
