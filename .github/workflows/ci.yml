name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: HARBOR_GO=go scripts/build.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test
      - run: ./dist/harbor version
      - name: Browser fixtures and dependency advisories
        if: matrix.runner == 'ubuntu-24.04'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
        run: |
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web run test:e2e
          npm --prefix web audit
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Keep browser failure evidence
        if: failure() && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
