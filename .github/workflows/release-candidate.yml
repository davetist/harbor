name: Build release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (for example 0.1.0-alpha.1)
        required: true
        default: 0.1.0-alpha.1
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build source, binary archives and Linux desktop/headless installers
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: HARBOR_GO=go scripts/build-release.sh "$RELEASE_VERSION"
      - run: go test -race ./... && go vet ./...
      - run: npm --prefix web run typecheck && npm --prefix web run test && npm --prefix web audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-release-candidate
          path: dist/releases
          if-no-files-found: error
          retention-days: 14
  mac-desktop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build universal local Mac candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: HARBOR_GO=go sh packaging/macos/build-app.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-mac-desktop-candidate
          path: dist/desktop
          if-no-files-found: error
          retention-days: 14
